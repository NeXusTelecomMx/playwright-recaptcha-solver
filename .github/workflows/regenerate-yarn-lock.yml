name: Regenerate yarn.lock

on:
  push:
    paths:
      - 'package.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate-lock:
    name: Regenerate yarn.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Enable Corepack and prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Install (regenerate yarn.lock)
        run: |
          yarn install

      - name: Commit and push yarn.lock if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add yarn.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): regenerate yarn.lock"
            git push
          else
            echo "No changes to yarn.lock"
          fi
